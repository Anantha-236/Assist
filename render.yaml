services:
  - type: web
    name: assist-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ASSIST_DB
        value: ./data/assist.db
      - key: ASSIST_ADMIN_PASSWORD
        sync: false
      - key: ASSIST_JWT_SECRET
        sync: false
      - key: ASSIST_SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL_PRIMARY
        value: qwen/qwen3.8-27b
      - key: GROQ_MODEL_FALLBACK
        value: allam-2-7b
      - key: LLM_PROVIDER
        value: groq
      - key: DAILY_QUESTION_LIMIT
        value: "200"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Assist
      - key: ADMIN_EMAILS
        sync: false