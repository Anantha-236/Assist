<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login — Assist Admin</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
<form method="post" action="/admin/login/start" class="login-card">
    <h1>Assist Admin</h1>
    <p class="muted">Sign in with an authenticator app (Google Authenticator, Authy, or Microsoft Authenticator).</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <input type="email" name="email" placeholder="admin@yourdomain.com" required autofocus>
    <button type="submit">Continue</button>
</form>
</body>
</html>
